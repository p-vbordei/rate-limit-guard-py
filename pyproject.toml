[project]
name = "kindred-rate-limit-guard"
version = "1.0.0"
description = "Cross-session and cross-process API rate limit guard for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vlad Bordei", email = "bordeivlad@gmail.com" }]
keywords = ["llm", "ai-agents", "rate-limit", "throttling", "api", "guard"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/p-vbordei/rate-limit-guard-py"
Repository = "https://github.com/p-vbordei/rate-limit-guard-py"
Issues = "https://github.com/p-vbordei/rate-limit-guard-py/issues"
Changelog = "https://github.com/p-vbordei/rate-limit-guard-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rate_limit_guard"]
